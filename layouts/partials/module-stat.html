{{- $s := newScratch -}}
{{- $s.Set "n" 0 -}}
{{- $s.Set "total" 0 -}}
{{- range .steps -}}
    {{- $s.Add "total" (len .lessons) -}}
    {{- range .lessons -}}
        {{- with .path }}{{ $s.Add "n" 1 }}{{ end -}}
    {{- end -}}
{{- end -}}
{{- return (dict "n" ($s.Get "n") "total" ($s.Get "total")) -}}
